[project]
name = "exu-github-mcp-mcp"
version = "1.0.0"
description = "Local stdio MCP server for managing GitHub repositories, issues, pull requests, branches, files, collaborators, and releases."
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
github-mcp = "server:main"

[tool.ruff]
line-length = 110
